---

- name: Include vars file if provided
  when: amd_gpu_vars_file != None
  ansible.builtin.include_vars:
    file: "{{ amd_gpu_vars_file }}"

- name: Get version numbers
  ansible.builtin.set_fact:
    rocm_major: "{{ (amd_gpu_rocm_version | split('.'))[0] | int }}"
    rocm_minor: "{{ (amd_gpu_rocm_version | split('.'))[1] | int }}"

- name: Setup rocm for via package manager
  when: ansible_facts.distribution | lower != "fedora"
  block:
    - name: Include install method
      ansible.builtin.include_tasks:
        file: "{{ ansible_facts.os_family | lower }}.yml"

    - name: Check whether hip runtime is discoverable
      ansible.builtin.command:
        cmd: ldconfig -p
      register: ldconfig_cache
      changed_when: false

    # required due to https://github.com/ROCm/TheRock/issues/6716
    # fedora ignores version anyway
    - name: Register rocm library
      become: true
      when: >-
        (
          '/opt/rocm/core-' ~ rocm_major ~ '.' ~ rocm_minor ~
          '/lib/libamdhip64.so'
        ) not in ldconfig_cache.stdout
      ansible.builtin.copy:
        dest: "/etc/ld.so.conf.d/rocm-{{ rocm_major }}.{{ rocm_minor }}.conf"
        content: "/opt/rocm/core-{{ rocm_major }}.{{ rocm_minor }}/lib\n"
        owner: root
        group: root
        mode: "0644"
      notify: Update dynamic linker cache

- name: Install distro packages
  become: true
  when: ansible_facts.distribution | lower == "fedora"
  ansible.builtin.package:
    name: "{{ amd_gpu_packages[ansible_facts.distribution | lower] | flatten + amd_gpu_rocm_fedora }}"
    state: present

...
